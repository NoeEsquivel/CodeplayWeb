<svg width="900" height="520" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg"><rect width="900" height="520" rx="28" fill="#111827"/><text x="55" y="70" fill="#f7df1e" font-family="Arial" font-size="34" font-weight="700">Comparaciones</text><text x="55" y="110" fill="#cbd5e1" font-family="Arial" font-size="20">Una comparacion responde true o false.</text><rect x="110" y="165" width="680" height="280" rx="24" fill="#0f172a" stroke="#334155" stroke-width="4"/><text x="170" y="230" fill="#e2e8f0" font-family="Courier New" font-size="28">puntos &gt;= 60</text><text x="600" y="230" fill="#22c55e" font-family="Arial" font-size="28" font-weight="700">true</text><text x="170" y="300" fill="#e2e8f0" font-family="Courier New" font-size="28">vida &lt;= 0</text><text x="600" y="300" fill="#ef4444" font-family="Arial" font-size="28" font-weight="700">false</text><text x="170" y="370" fill="#e2e8f0" font-family="Courier New" font-size="28">respuesta === 'a'</text><text x="600" y="370" fill="#f59e0b" font-family="Arial" font-size="28" font-weight="700">depende</text></svg>
