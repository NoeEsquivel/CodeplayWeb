<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640">
  <rect width="1000" height="640" rx="16" fill="#12121c"/>
  <rect x="8" y="8" width="984" height="624" rx="12" fill="#1a1a2e" stroke="#00ff9d" stroke-width="3"/>
  <text x="40" y="48" fill="#00ff9d" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Como se ven los encabezados en el navegador</text>
  <text x="40" y="78" fill="#9cdcfe" font-family="Consolas, Courier New, monospace" font-size="16">&lt;h1&gt; &amp; &lt;h6&gt; + &lt;p&gt;</text>
  <rect x="40" y="100" width="920" height="500" rx="10" fill="#f7f7f7"/>
  <circle cx="70" cy="128" r="8" fill="#ff5f57"/>
  <circle cx="96" cy="128" r="8" fill="#febc2e"/>
  <circle cx="122" cy="128" r="8" fill="#28c840"/>
  <text x="150" y="134" fill="#555" font-family="Segoe UI, Arial, sans-serif" font-size="14">pagina.html</text>
  <line x1="40" y1="150" x2="960" y2="150" stroke="#ddd"/>
  <text x="60" y="200" fill="#111" font-family="Georgia, serif" font-size="42" font-weight="700">Titulo principal</text>
  <text x="680" y="196" fill="#6a11cb" font-family="Consolas, Courier New, monospace" font-size="16">&lt;h1&gt;</text>
  <text x="60" y="250" fill="#222" font-family="Georgia, serif" font-size="32" font-weight="700">Subtitulo de seccion</text>
  <text x="680" y="246" fill="#6a11cb" font-family="Consolas, Courier New, monospace" font-size="16">&lt;h2&gt;</text>
  <text x="60" y="292" fill="#333" font-family="Georgia, serif" font-size="26" font-weight="700">Tema dentro de la seccion</text>
  <text x="680" y="288" fill="#6a11cb" font-family="Consolas, Courier New, monospace" font-size="16">&lt;h3&gt;</text>
  <text x="60" y="328" fill="#444" font-family="Georgia, serif" font-size="22" font-weight="700">Detalle menor</text>
  <text x="680" y="324" fill="#6a11cb" font-family="Consolas, Courier New, monospace" font-size="16">&lt;h4&gt;</text>
  <text x="60" y="360" fill="#555" font-family="Georgia, serif" font-size="18" font-weight="700">Encabezado h5</text>
  <text x="680" y="356" fill="#6a11cb" font-family="Consolas, Courier New, monospace" font-size="16">&lt;h5&gt;</text>
  <text x="60" y="388" fill="#666" font-family="Georgia, serif" font-size="16" font-weight="700">Encabezado h6</text>
  <text x="680" y="384" fill="#6a11cb" font-family="Consolas, Courier New, monospace" font-size="16">&lt;h6&gt;</text>
  <text x="60" y="440" fill="#222" font-family="Georgia, serif" font-size="18">Este es un parrafo. El texto normal de la pagina va dentro de p.</text>
  <text x="60" y="468" fill="#222" font-family="Georgia, serif" font-size="18">Cada idea nueva debe ir en otro parrafo, no en el mismo bloque.</text>
  <text x="680" y="452" fill="#2575fc" font-family="Consolas, Courier New, monospace" font-size="16">&lt;p&gt;</text>
  <rect x="60" y="500" width="840" height="70" rx="8" fill="#eef6ff" stroke="#2575fc" stroke-width="2"/>
  <text x="80" y="530" fill="#1a1a2e" font-family="Segoe UI, Arial, sans-serif" font-size="16">h1 es el titulo de toda la pagina. Usa h2 y h3 para organizar el contenido</text>
  <text x="80" y="554" fill="#1a1a2e" font-family="Segoe UI, Arial, sans-serif" font-size="16">como un indice: de lo general a lo especifico.</text>
</svg>
