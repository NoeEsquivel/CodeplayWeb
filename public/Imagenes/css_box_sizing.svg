<svg width="900" height="520" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg"><rect width="900" height="520" rx="28" fill="#0f172a"/><text x="55" y="70" fill="#00ff9d" font-family="Arial" font-size="34" font-weight="700">box-sizing</text><text x="55" y="110" fill="#cbd5e1" font-family="Arial" font-size="20">border-box hace que el tamano total sea mas facil de controlar.</text><g transform="translate(95 165)"><rect width="290" height="225" rx="18" fill="#111827" stroke="#ef4444" stroke-width="4"/><rect x="45" y="50" width="200" height="115" fill="#1d4ed8" stroke="#f59e0b" stroke-width="18"/><text x="45" y="205" fill="#fecaca" font-family="Arial" font-size="22" font-weight="700">content-box</text><text x="45" y="235" fill="#cbd5e1" font-family="Courier New" font-size="17">crece con padding/border</text></g><g transform="translate(515 165)"><rect width="290" height="225" rx="18" fill="#111827" stroke="#22c55e" stroke-width="4"/><rect x="45" y="50" width="200" height="115" fill="#1d4ed8" stroke="#00ff9d" stroke-width="18"/><rect x="45" y="50" width="200" height="115" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="8 8"/><text x="45" y="205" fill="#86efac" font-family="Arial" font-size="22" font-weight="700">border-box</text><text x="45" y="235" fill="#cbd5e1" font-family="Courier New" font-size="17">respeta el ancho total</text></g></svg>
