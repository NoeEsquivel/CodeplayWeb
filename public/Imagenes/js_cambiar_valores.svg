<svg width="900" height="520" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg"><rect width="900" height="520" rx="28" fill="#0f172a"/><text x="55" y="70" fill="#f7df1e" font-family="Arial" font-size="34" font-weight="700">Cambiar valores</text><text x="55" y="110" fill="#cbd5e1" font-family="Arial" font-size="20">let permite actualizar datos como puntos, vida o monedas.</text><rect x="110" y="185" width="260" height="190" rx="24" fill="#111827" stroke="#60a5fa" stroke-width="4"/><text x="155" y="250" fill="white" font-family="Arial" font-size="26" font-weight="700">monedas</text><text x="210" y="315" fill="#f7df1e" font-family="Arial" font-size="44" font-weight="700">3</text><path d="M400 280 H500" stroke="#00ff9d" stroke-width="7"/><path d="M500 280 L475 263 M500 280 L475 297" stroke="#00ff9d" stroke-width="7" fill="none"/><rect x="535" y="185" width="260" height="190" rx="24" fill="#111827" stroke="#22c55e" stroke-width="4"/><text x="580" y="250" fill="white" font-family="Arial" font-size="26" font-weight="700">monedas</text><text x="635" y="315" fill="#f7df1e" font-family="Arial" font-size="44" font-weight="700">5</text><text x="310" y="440" fill="#86efac" font-family="Courier New" font-size="22">monedas = monedas + 2;</text></svg>
