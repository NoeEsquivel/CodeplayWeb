<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
  <title id="title">Ejemplo de formulario interactivo</title>
  <desc id="desc">Tarjeta morada con campos de nombre, correo, área de interés y un botón de registro.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#667eea"/>
      <stop offset="1" stop-color="#764ba2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#1d1640" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="900" height="540" rx="28" fill="url(#bg)"/>
  <circle cx="90" cy="80" r="70" fill="#fff" opacity=".08"/>
  <circle cx="820" cy="460" r="120" fill="#fff" opacity=".07"/>
  <rect x="235" y="35" width="430" height="470" rx="24" fill="#fff" filter="url(#shadow)"/>
  <text x="450" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#2c3e50">Únete al equipo</text>
  <text x="450" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7f8c8d">Completa tus datos para registrarte</text>
  <text x="280" y="158" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2c3e50">Nombre completo</text>
  <rect x="280" y="168" width="340" height="38" rx="9" fill="#fafafa" stroke="#d9dce6" stroke-width="2"/>
  <text x="296" y="193" font-family="Arial, sans-serif" font-size="13" fill="#9aa0ad">Escribe tu nombre</text>
  <text x="280" y="235" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2c3e50">Correo electrónico</text>
  <rect x="280" y="245" width="340" height="38" rx="9" fill="#fafafa" stroke="#d9dce6" stroke-width="2"/>
  <text x="296" y="270" font-family="Arial, sans-serif" font-size="13" fill="#9aa0ad">tu@email.com</text>
  <text x="280" y="312" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2c3e50">Área de interés</text>
  <rect x="280" y="322" width="340" height="38" rx="9" fill="#fafafa" stroke="#d9dce6" stroke-width="2"/>
  <text x="296" y="347" font-family="Arial, sans-serif" font-size="13" fill="#9aa0ad">Selecciona una opción</text>
  <path d="M595 337l8 8 8-8" fill="none" stroke="#667eea" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="280" y="390" width="340" height="52" rx="12" fill="url(#bg)"/>
  <text x="450" y="423" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#fff">Registrarme ahora</text>
  <text x="450" y="474" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#667eea">✓ Mensaje de confirmación con JavaScript</text>
</svg>
