<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a1020"/><stop offset="1" stop-color="#07111f"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.42"/></filter>
  </defs>
  <rect width="980" height="560" rx="32" fill="url(#bg)"/>
  <text x="490" y="60" text-anchor="middle" font-family="Segoe UI, Arial" font-size="34" font-weight="800" fill="#00ff99">Referencia: Sesiones y Cookies</text>
  <text x="490" y="96" text-anchor="middle" font-family="Segoe UI, Arial" font-size="17" fill="#f2d7ff">El servidor puede recordar datos del usuario entre visitas.</text>
  <rect x="115" y="170" width="230" height="185" rx="22" fill="#6ea8ff" filter="url(#shadow)"/>
  <text x="230" y="235" text-anchor="middle" font-family="Segoe UI, Arial" font-size="24" font-weight="800" fill="#0b1b35">Usuario</text>
  <text x="230" y="280" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" fill="#0b1b35">Abre la página</text>
  <rect x="405" y="145" width="230" height="235" rx="22" fill="#7b68ee" filter="url(#shadow)"/>
  <text x="520" y="205" text-anchor="middle" font-family="Segoe UI, Arial" font-size="24" font-weight="800" fill="#fff">Servidor</text>
  <text x="520" y="255" text-anchor="middle" font-family="Consolas, monospace" font-size="19" fill="#fff">session_start()</text>
  <text x="520" y="292" text-anchor="middle" font-family="Consolas, monospace" font-size="19" fill="#fff">$_SESSION</text>
  <text x="520" y="329" text-anchor="middle" font-family="Consolas, monospace" font-size="19" fill="#fff">setcookie()</text>
  <rect x="695" y="170" width="230" height="185" rx="22" fill="#2cf2a5" filter="url(#shadow)"/>
  <text x="810" y="232" text-anchor="middle" font-family="Segoe UI, Arial" font-size="24" font-weight="800" fill="#082a20">Recuerdo</text>
  <text x="810" y="278" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" fill="#06402d">nombre / tema</text>
  <path d="M355 262 H397" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <path d="M645 262 H687" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <text x="490" y="508" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" fill="#ffffff">Pista: sesión = recuerdo del servidor; cookie = recuerdo guardado en el navegador.</text>
</svg>