<svg width="900" height="520" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg"><rect width="900" height="520" rx="28" fill="#0f172a"/><text x="55" y="70" fill="#00ff9d" font-family="Arial" font-size="34" font-weight="700">Flexbox: contenedor e hijos</text><text x="55" y="110" fill="#cbd5e1" font-family="Arial" font-size="20">El padre usa display: flex y acomoda a sus elementos internos.</text><rect x="95" y="160" width="710" height="250" rx="24" fill="#111827" stroke="#00ff9d" stroke-width="5"/><text x="125" y="205" fill="#86efac" font-family="Courier New" font-size="20">.contenedor { display: flex; }</text><rect x="150" y="255" width="130" height="90" rx="18" fill="#3b82f6"/><rect x="315" y="255" width="130" height="90" rx="18" fill="#a855f7"/><rect x="480" y="255" width="130" height="90" rx="18" fill="#f59e0b"/><rect x="645" y="255" width="130" height="90" rx="18" fill="#22c55e"/><text x="190" y="310" fill="white" font-family="Arial" font-size="24" font-weight="700">1</text><text x="355" y="310" fill="white" font-family="Arial" font-size="24" font-weight="700">2</text><text x="520" y="310" fill="#111827" font-family="Arial" font-size="24" font-weight="700">3</text><text x="685" y="310" fill="#062b14" font-family="Arial" font-size="24" font-weight="700">4</text><text x="360" y="455" fill="#cbd5e1" font-family="Arial" font-size="22">hijos flexibles</text></svg>
