<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a1020"/><stop offset="1" stop-color="#07111f"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.42"/></filter>
  </defs>
  <rect width="980" height="560" rx="32" fill="url(#bg)"/>
  <text x="490" y="60" text-anchor="middle" font-family="Segoe UI, Arial" font-size="34" font-weight="800" fill="#00ff99">Referencia: Componentes Bootstrap</text>
  <text x="490" y="96" text-anchor="middle" font-family="Segoe UI, Arial" font-size="17" fill="#f2d7ff">Una tarjeta con badge, botón y alerta lista para verse profesional.</text>
  <g filter="url(#shadow)">
    <rect x="275" y="145" width="430" height="300" rx="24" fill="#ffffff"/>
    <rect x="275" y="145" width="430" height="84" rx="24" fill="#6f42c1"/>
    <rect x="315" y="260" width="120" height="34" rx="17" fill="#dc3545"/>
    <rect x="315" y="330" width="160" height="52" rx="13" fill="#0d6efd"/>
    <rect x="505" y="330" width="150" height="52" rx="13" fill="#198754"/>
  </g>
  <text x="490" y="198" text-anchor="middle" font-family="Segoe UI, Arial" font-size="28" font-weight="800" fill="#ffffff">Card de Bootstrap</text>
  <text x="375" y="284" text-anchor="middle" font-family="Segoe UI, Arial" font-size="17" font-weight="800" fill="#ffffff">badge</text>
  <text x="395" y="363" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" font-weight="800" fill="#ffffff">btn-primary</text>
  <text x="580" y="363" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" font-weight="800" fill="#ffffff">alert</text>
  <text x="490" y="508" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" fill="#ffffff">Pista: Bootstrap te da piezas listas; tú eliges y combinas clases.</text>
</svg>