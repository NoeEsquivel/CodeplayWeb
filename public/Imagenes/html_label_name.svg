  <text x="40" y="52" fill="#00ff9d" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">label, id y name trabajan juntos</text>
  <rect x="60" y="105" width="410" height="330" rx="14" fill="#f7f7f7"/>
  <text x="100" y="170" fill="#111" font-family="Segoe UI, Arial, sans-serif" font-size="18">Nombre de jugador</text>
  <rect x="100" y="190" width="290" height="50" rx="8" fill="#fff" stroke="#2575fc" stroke-width="2"/>
  <text x="120" y="222" fill="#777" font-family="Segoe UI, Arial, sans-serif" font-size="16">ShadowCoder</text>
  <path d="M190 172 C230 125, 335 125, 365 185" fill="none" stroke="#00a1ff" stroke-width="5" stroke-linecap="round"/>
  <text x="105" y="305" fill="#333" font-family="Segoe UI, Arial, sans-serif" font-size="16">Al tocar el texto del label, el input queda activo.</text>
  <rect x="530" y="105" width="410" height="330" rx="14" fill="#111827" stroke="#2575fc" stroke-width="2"/>
  <rect x="560" y="155" width="350" height="155" rx="10" fill="#1e1e1e"/>
  <text x="585" y="200" fill="#569cd6" font-family="Consolas, Courier New, monospace" font-size="19">&lt;label</text>
  <text x="665" y="200" fill="#9cdcfe" font-family="Consolas, Courier New, monospace" font-size="19"> for</text>
  <text x="710" y="200" fill="#d4d4d4" font-family="Consolas, Courier New, monospace" font-size="19">=</text>
  <text x="728" y="200" fill="#ce9178" font-family="Consolas, Courier New, monospace" font-size="19">&quot;nombre&quot;</text>
  <text x="820" y="200" fill="#569cd6" font-family="Consolas, Courier New, monospace" font-size="19">&gt;</text>
  <text x="585" y="236" fill="#569cd6" font-family="Consolas, Courier New, monospace" font-size="19">&lt;input</text>
  <text x="665" y="236" fill="#9cdcfe" font-family="Consolas, Courier New, monospace" font-size="19"> id</text>
  <text x="700" y="236" fill="#d4d4d4" font-family="Consolas, Courier New, monospace" font-size="19">=</text>
  <text x="718" y="236" fill="#ce9178" font-family="Consolas, Courier New, monospace" font-size="19">&quot;nombre&quot;</text>
  <text x="585" y="272" fill="#9cdcfe" font-family="Consolas, Courier New, monospace" font-size="19">name</text>
  <text x="638" y="272" fill="#d4d4d4" font-family="Consolas, Courier New, monospace" font-size="19">=</text>
  <text x="656" y="272" fill="#ce9178" font-family="Consolas, Courier New, monospace" font-size="19">&quot;nombre&quot;</text>
  <text x="750" y="272" fill="#569cd6" font-family="Consolas, Courier New, monospace" font-size="19">&gt;</text>
  <text x="560" y="365" fill="#e5e7eb" font-family="Segoe UI, Arial, sans-serif" font-size="16">id conecta el label. name identifica el dato enviado.</text>
