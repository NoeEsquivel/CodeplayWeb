<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a1020"/><stop offset="1" stop-color="#07111f"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.42"/></filter>
  </defs>
  <rect width="980" height="560" rx="32" fill="url(#bg)"/>
  <text x="490" y="60" text-anchor="middle" font-family="Segoe UI, Arial" font-size="34" font-weight="800" fill="#00ff99">Referencia: Introducción a PHP</text>
  <text x="490" y="96" text-anchor="middle" font-family="Segoe UI, Arial" font-size="17" fill="#f2d7ff">PHP se ejecuta en el servidor y genera una respuesta para el navegador.</text>
  <rect x="95" y="170" width="220" height="150" rx="22" fill="#6ea8ff" filter="url(#shadow)"/>
  <rect x="380" y="145" width="220" height="200" rx="22" fill="#7b68ee" filter="url(#shadow)"/>
  <rect x="665" y="170" width="220" height="150" rx="22" fill="#2cf2a5" filter="url(#shadow)"/>
  <text x="205" y="235" text-anchor="middle" font-family="Segoe UI, Arial" font-size="24" font-weight="800" fill="#0b1b35">Navegador</text>
  <text x="490" y="226" text-anchor="middle" font-family="Segoe UI, Arial" font-size="24" font-weight="800" fill="#ffffff">Servidor PHP</text>
  <text x="775" y="235" text-anchor="middle" font-family="Segoe UI, Arial" font-size="24" font-weight="800" fill="#082a20">HTML</text>
  <path d="M320 245 H372" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <path d="M608 245 H660" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <text x="490" y="292" text-anchor="middle" font-family="Segoe UI, Arial" font-size="20" font-weight="800" fill="#ffffff">$variable + echo</text>
  <rect x="245" y="390" width="490" height="55" rx="15" fill="#ffffff"/>
  <text x="490" y="426" text-anchor="middle" font-family="Consolas, monospace" font-size="20" font-weight="800" fill="#182033">&lt;?php echo "Hola estudiante"; ?&gt;</text>
  <text x="490" y="508" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" fill="#ffffff">Pista: el usuario no ve PHP; ve el resultado que PHP produce.</text>
</svg>