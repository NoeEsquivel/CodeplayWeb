<svg width="900" height="520" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg"><rect width="900" height="520" rx="28" fill="#111827"/><text x="55" y="70" fill="#00ff9d" font-family="Arial" font-size="34" font-weight="700">Contraste y legibilidad</text><text x="55" y="108" fill="#cbd5e1" font-family="Arial" font-size="20">Un buen estilo tambien debe poder leerse sin esfuerzo.</text><g transform="translate(70 155)"><rect width="350" height="250" rx="24" fill="#0f172a" stroke="#22c55e" stroke-width="4"/><text x="35" y="72" fill="#22c55e" font-family="Arial" font-size="28" font-weight="700">Buen contraste</text><text x="35" y="125" fill="#f8fafc" font-family="Arial" font-size="24">Texto claro</text><text x="35" y="165" fill="#e2e8f0" font-family="Arial" font-size="22">sobre fondo oscuro.</text><text x="35" y="215" fill="#86efac" font-family="Courier New" font-size="18">Facil de leer OK</text></g><g transform="translate(480 155)"><rect width="350" height="250" rx="24" fill="#94a3b8" stroke="#ef4444" stroke-width="4"/><text x="35" y="72" fill="#cbd5e1" font-family="Arial" font-size="28" font-weight="700">Bajo contraste</text><text x="35" y="125" fill="#d1d5db" font-family="Arial" font-size="24">Texto parecido</text><text x="35" y="165" fill="#e5e7eb" font-family="Arial" font-size="22">al color del fondo.</text><text x="35" y="215" fill="#fecaca" font-family="Courier New" font-size="18">Cuesta leer</text></g></svg>
