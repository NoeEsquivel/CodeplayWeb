<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17122d"/><stop offset="1" stop-color="#07111f"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#000" flood-opacity="0.38"/></filter></defs>
  <rect width="980" height="560" rx="32" fill="url(#bg)"/>
  <text x="490" y="58" text-anchor="middle" font-family="Segoe UI, Arial" font-size="34" font-weight="800" fill="#00ff99">Referencia: CSS Grid Layout</text>
  <text x="490" y="94" text-anchor="middle" font-family="Segoe UI, Arial" font-size="17" fill="#d7e4ff">Una cuadrícula simple con header, contenido, lateral y footer.</text>
  <rect x="140" y="135" width="700" height="335" rx="24" fill="#17213b" stroke="#00ff99" stroke-width="4" stroke-dasharray="10 9"/>
  <g filter="url(#shadow)" font-family="Segoe UI, Arial" font-size="22" font-weight="800">
    <rect x="185" y="180" width="610" height="65" rx="14" fill="#6ea8ff"/>
    <text x="490" y="222" text-anchor="middle" fill="#0b1b35">HEADER</text>
    <rect x="185" y="270" width="380" height="105" rx="14" fill="#2cf2a5"/>
    <text x="375" y="333" text-anchor="middle" fill="#082a20">CONTENIDO</text>
    <rect x="590" y="270" width="205" height="105" rx="14" fill="#f7b955"/>
    <text x="692" y="333" text-anchor="middle" fill="#261c08">LATERAL</text>
    <rect x="185" y="400" width="610" height="45" rx="14" fill="#ff6ea8"/>
    <text x="490" y="431" text-anchor="middle" fill="#351022">FOOTER</text>
  </g>
  <text x="176" y="510" font-family="Segoe UI, Arial" font-size="18" fill="#fff">Pista: Grid sirve para acomodar elementos en filas y columnas.</text>
</svg>