<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15172b"/>
      <stop offset="1" stop-color="#09111f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="980" height="620" rx="34" fill="url(#bg)"/>
  <text x="490" y="62" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" fill="#00ff99">Referencia: Modelo de Caja CSS</text>
  <text x="490" y="98" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#d7e4ff">La caja final debe mostrar separación exterior, borde, espacio interior y contenido.</text>
  <rect x="105" y="138" width="770" height="395" rx="28" fill="#29334d" stroke="#7c8aa8" stroke-width="4" stroke-dasharray="12 10"/>
  <text x="135" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#cfd8ff">margin</text>
  <text x="135" y="202" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#aebbea">Espacio por fuera de la caja</text>
  <rect x="185" y="218" width="610" height="265" rx="22" fill="#f7b955" stroke="#ffd78a" stroke-width="6" filter="url(#shadow)"/>
  <text x="214" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="800" fill="#1f1f2e">border</text>
  <text x="214" y="277" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#3b3140">La línea que rodea la caja</text>
  <rect x="260" y="305" width="460" height="130" rx="18" fill="#2cf2a5" stroke="#07b574" stroke-width="4"/>
  <text x="288" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#083426">padding</text>
  <text x="288" y="366" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#06402d">Espacio entre el borde y el contenido</text>
  <rect x="392" y="368" width="196" height="44" rx="12" fill="#ffffff"/>
  <text x="490" y="397" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#182033">Contenido</text>
  <line x1="105" y1="560" x2="875" y2="560" stroke="#00ff99" stroke-width="3" stroke-linecap="round"/>
  <text x="490" y="592" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#ffffff">Pista visual: crea una tarjeta con width, margin, padding y border.</text>
</svg>